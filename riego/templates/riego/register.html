{% extends 'riego/base.html' %}

{% block contenido %}
    <div class="auth-shell">
        <div class="auth-card">
            <h2>Crear cuenta</h2>
            <div class="auth-header-logo" style="text-align: center; margin-bottom: 20px;">
                <img src="{% static 'riego/images/logo.jpeg' %}" alt="SIRIGO" style="max-width: 220px; height: auto; width: auto; display: block; margin: 0 auto; border-radius: 12px;">
            </div>
            <form method="post" class="form-layout">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Registrarse</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        // Ver login.html: recarga si se restaura del caché para renovar el CSRF.
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
{% endblock %}
