{% extends 'riego/base.html' %}

{% block contenido %}
    <div class="page-card">
        <div class="page-header">
            <div>
                <span class="section-tag">Mi perfil</span>
                <h2>{{ user.username }}</h2>
            </div>
        </div>

        {% if messages %}
            {% for message in messages %}
                <p class="status-badge {% if message.tags == 'error' %}rejected{% else %}approved{% endif %}">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data" class="form-layout">
            {% csrf_token %}
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" name="nombre" value="{{ perfil.nombre }}" required>
            </div>
            <div class="form-group">
                <label for="cedula">Cédula:</label>
                <input type="text" name="cedula" value="{{ perfil.cedula }}">
            </div>
            <div class="form-group">
                <label for="plan">Plan contratado:</label>
                <select name="plan">
                    <option value="basico" {% if perfil.plan == 'basico' %}selected{% endif %}>Básico</option>
                    <option value="estandar" {% if perfil.plan == 'estandar' %}selected{% endif %}>Estándar</option>
                    <option value="premium" {% if perfil.plan == 'premium' %}selected{% endif %}>Premium</option>
                </select>
            </div>
            <div class="form-group">
                <label for="foto">Foto de perfil:</label>
                <input type="file" name="foto" accept="image/*">
                {% if perfil.foto %}
                    <img class="plant-photo" src="{{ perfil.foto.url }}" alt="Foto de perfil" style="max-width: 150px; margin-top: 10px; border-radius: 50%;">
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>
    </div>
{% endblock %}
