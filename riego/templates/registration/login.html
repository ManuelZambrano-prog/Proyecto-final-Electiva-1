{% extends 'riego/base.html' %}
{% load static %}

{% block contenido %}
    <div class="auth-shell auth-shell--login" style="background-image: url('{% static 'riego/img/login-fondo.jpg' %}');">
        <div class="auth-card">
            <div class="auth-header-logo" style="text-align: center; margin-bottom: 20px;">
                <img src="{% static 'riego/images/logo.jpeg' %}" alt="SIRIGO" style="max-width: 220px; height: auto; width: auto; display: block; margin: 0 auto; border-radius: 12px;">
            </div>
            <h2>Iniciar sesión</h2>
            <form method="post" class="form-layout">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Entrar</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        // Si el navegador restaura esta página del caché (botón atrás),
        // el token CSRF está viejo porque Django lo rota al iniciar sesión.
        // Recargar garantiza un token fresco y evita el 403.
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        });

        // Si el usuario ya está autenticado, redirigir al panel inmediatamente
        // para evitar que el login se muestre sobre el panel.
        if ('{% if user.is_authenticated %}true{% else %}false{% endif %}' === 'true') {
            window.location.href = '{% url 'panel' %}';
        }
    </script>
{% endblock %}
