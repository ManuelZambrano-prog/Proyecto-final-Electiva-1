{% extends 'riego/base.html' %}

{% block contenido %}
    <div class="auth-shell auth-shell--login">
        <div class="auth-card">
            <h2>Iniciar sesión</h2>
            <form method="post" class="form-layout">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Entrar</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        // Si el navegador restaura esta página del caché (botón atrás),
        // el token CSRF está viejo porque Django lo rota al iniciar sesión.
        // Recargar garantiza un token fresco y evita el 403.
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
{% endblock %}
